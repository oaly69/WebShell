name: Auto Deploy Web FinalShell

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build, Migrate D1 & Deploy to CF Workers
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Auto-detect or Create D1 Database UUID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Listing D1 databases from Cloudflare account..."
          D1_LIST=$(pnpm wrangler d1 list --json)
          D1_UUID=$(echo "$D1_LIST" | jq -r '.[] | select(.name == "finalshell-sync-db") | .uuid' | head -n 1)

          if [ -z "$D1_UUID" ] || [ "$D1_UUID" = "null" ]; then
            echo "Database finalshell-sync-db not found in list, creating it..."
            pnpm wrangler d1 create finalshell-sync-db
            D1_LIST=$(pnpm wrangler d1 list --json)
            D1_UUID=$(echo "$D1_LIST" | jq -r '.[] | select(.name == "finalshell-sync-db") | .uuid' | head -n 1)
          fi

          if [ -z "$D1_UUID" ] || [ "$D1_UUID" = "null" ]; then
            echo "::error::Failed to resolve D1 UUID for finalshell-sync-db. D1 List output: $D1_LIST"
            exit 1
          fi

          echo "Successfully resolved D1 UUID: $D1_UUID"
          # Replace placeholder database_id in wrangler.jsonc
          sed -i "s/\"database_id\": \".*\"/\"database_id\": \"$D1_UUID\"/" wrangler.jsonc

      - name: Typecheck & Build Application
        run: |
          pnpm run typecheck
          pnpm run build

      - name: Apply D1 Database Migrations (Remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm wrangler d1 migrations apply finalshell-sync-db --remote

      - name: Deploy Worker & Static Assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm wrangler deploy
