name: Auto Deploy Web FinalShell

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build, Migrate D1 & Deploy to CF Workers
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Auto-detect or Create D1 Database UUID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Checking D1 database finalshell-sync-db..."
          D1_JSON=$(pnpm wrangler d1 info finalshell-sync-db --json 2>/dev/null || echo "{}")
          D1_UUID=$(echo "$D1_JSON" | jq -r '.uuid // empty')

          if [ -z "$D1_UUID" ]; then
            echo "D1 database not found on Cloudflare, creating finalshell-sync-db..."
            pnpm wrangler d1 create finalshell-sync-db
            D1_JSON=$(pnpm wrangler d1 info finalshell-sync-db --json)
            D1_UUID=$(echo "$D1_JSON" | jq -r '.uuid // empty')
          fi

          echo "Resolved D1 UUID: $D1_UUID"
          # Auto-inject into wrangler.jsonc for deployment
          sed -i "s/\"database_id\": \".*\"/\"database_id\": \"$D1_UUID\"/" wrangler.jsonc

      - name: Typecheck & Build Application
        run: |
          pnpm run typecheck
          pnpm run build

      - name: Apply D1 Database Migrations (Remote)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply finalshell-sync-db --remote

      - name: Deploy Worker & Static Assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
